<body>

    <h2>Window events</h2>
    <section class="maincontainer">
        <div class="gallerycontainer">
            <img class="galleryimage" src="images/image/spring.jpg" alt="Image of spring">

            <img class="galleryimage" src="images/image/summer.jpg" alt="Image of summer">

            <img class="galleryimage" src="images/image/fall.jpg" alt="Image of fall">

            <img class="galleryimage" src="images/image/winter.jpg" alt="Image of winter">
        </div>

        <button type="button" class="btnright">&#x276F;</button>
        <button type="button" class="btnleft">&#x276E;</button>
</section>
        

        <h2>Form events</h2>
        <form id="myForm">
            <div class="formsession">
                <label for="username">username:</label>
                <input type="text" id="username" name="username" placeholder="Type username....">
            </div>
            <div class="formsession">
                <label for="password">password:</label>
                <input type="password" id="password" name="password" placeholder="Enter a password...">
                <p class="passwordmsg">must be at least 8 characters</p>
                <div id="passwordError">error</div>
            </div>
            
            
            <button type="submit" class="submitbtn">Submit</button>
        </form>

    <!-----display message using the data from the from-->>

        </div>
